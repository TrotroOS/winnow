# Deploy static Next.js inspection UI to Vercel on push to main.
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

name: Deploy inspection UI to Vercel

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "fixtures/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "vercel.json"
      - "tsconfig.json"
      - ".github/workflows/vercel-static.yml"

jobs:
  deploy:
    if: github.repository == 'TrotroOS/winnow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: "--prod"