# Deploy Node web app to Vercel on push to main.
# Add repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (create project once: vercel link, or import TrotroOS/winnow in Vercel dashboard)

name: Deploy web app to Vercel

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "public/**"
      - "server.mjs"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/vercel-static.yml"

jobs:
  deploy:
    if: github.repository == 'TrotroOS/winnow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: "--prod"