[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winnow"
version = "0.1.0"
description = "Binary-only pipeline to find and outreach startup users"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["winnow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]