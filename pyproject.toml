[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winnow"
version = "0.1.0"
description = "Binary-only startup user discovery and outreach pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
cli = ["pyyaml>=6.0"]
dev = ["pytest>=8.0", "pyyaml>=6.0", "freezegun>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]