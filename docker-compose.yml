# Copy .env.example to .env before `docker compose up`.
services:
  scheduler:
    build: .
    image: winnow:local
    env_file:
      - path: .env
        required: false
    environment:
      WINNOW_DB_PATH: /data/winnow.sqlite
      WINNOW_DATA_DIR: /data
      WINNOW_LOGS_DIR: /logs
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./backups:/backups
    restart: unless-stopped
    command:
      - python
      - -m
      - winnow.scheduler
      - --config
      - /app/config.yaml
      - --logs-dir
      - /logs
    healthcheck:
      test: ["CMD", "python", "-m", "winnow.healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  # One-shot scheduler cycle (dry-run + batch staging; never auto-sends).
  run-once:
    profiles: ["manual"]
    build: .
    image: winnow:local
    env_file:
      - path: .env
        required: false
    environment:
      WINNOW_DB_PATH: /data/winnow.sqlite
      WINNOW_DATA_DIR: /data
      WINNOW_LOGS_DIR: /logs
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./backups:/backups
    command:
      - python
      - -m
      - winnow.run
      - schedule
      - --config
      - /app/config.yaml
      - --once
      - --logs-dir
      - /logs

  # One-shot CLI dry-run (safe default for manual validation).
  dry-run:
    profiles: ["manual"]
    build: .
    image: winnow:local
    env_file:
      - path: .env
        required: false
    environment:
      WINNOW_DB_PATH: /data/winnow.sqlite
      WINNOW_DATA_DIR: /data
      WINNOW_LOGS_DIR: /logs
    volumes:
      - ./data:/data
      - ./logs:/logs
    command:
      - python
      - -m
      - winnow.run
      - --config
      - /app/config_community.yaml
      - --limit
      - "50"
      - --dry-run

volumes: {}